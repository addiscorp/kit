name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Public repo: self-hosted runners refuse public repos (a fork PR must never
    # run on our machines); GitHub-hosted runners are free here (addiscorp/infra#34).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      # Builds dist/, then drives the header and footer in a DOM.
      - run: npm test
