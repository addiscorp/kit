name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Temporary (addiscorp/infra#34): [simien] no longer hosts mirab VMs. Back to
    # a fresh mirab VM, mirab-linux-x64 (APS 11), once x86 mirab VMs have capacity.
    runs-on: host-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      # Builds dist/, then drives the header and footer in a DOM.
      - run: npm test
